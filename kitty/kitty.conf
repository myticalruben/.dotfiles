# Kitty es el terminal por defecto de Mytical (ADR 0003).
# La paleta real vive en ~/.cache/kitty/neon.conf, que se regenera con el
# wallpaper. El bloque de abajo es el fallback si el cache todavía no existe.
font_family JetBrainsMono Nerd Font
font_size 12
cursor_shape block
cursor_blink_interval 0.6
mouse_hide_wait 2.0
scrollback_lines 10000
copy_on_select no
enable_audio_bell no
window_padding_width 10
confirm_os_window_close 0
background #05080f
foreground #e4fcff
cursor #00f0ff
selection_background #ff2bd6
selection_foreground #05080f
color0 #05080f
color8 #5e6b86
color1 #ff4d6d
color9 #ff869c
color2 #00e68a
color10 #5dffb0
color3 #e7e854
color11 #ffff7a
color4 #4d8dff
color12 #8ab5ff
color5 #ff2bd6
color13 #ff7fe6
color6 #00f0ff
color14 #8ff8ff
color7 #d9fbff
color15 #ffffff
globinclude ~/.cache/kitty/*.conf
